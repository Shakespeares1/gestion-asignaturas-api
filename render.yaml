services:
  - type: web
    name: gestion-asignaturas-api
    runtime: docker
    plan: free
    repo: https://github.com/Shakespeares1/gestion-asignaturas-api
    branch: codex/actividad2-auth-y-kodular-remote
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: gestion-asignaturas-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: gestion-asignaturas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gestion-asignaturas-db
          property: password
      - key: JWT_SECRET_BASE64
        generateValue: true
      - key: JWT_ISSUER
        value: gestion-academica
      - key: JWT_TTL_SECONDS
        value: "900"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: APP_PROXY_TRUSTED_CIDRS
        value: ""

databases:
  - name: gestion-asignaturas-db
    databaseName: gestion_academica
    user: gestion_academica_app
    plan: free
    region: oregon
    diskSizeGB: 1
